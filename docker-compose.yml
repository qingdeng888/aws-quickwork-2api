# Docker Compose deployment for aws-quickwork-2api.
#
#   cp .env.example .env      # edit the port, password and API keys
#   docker compose pull       # use the prebuilt image from GHCR
#   docker compose up -d
#   open http://127.0.0.1:8080/admin/
#
# Build the image locally instead of pulling it:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# `env_file: .env` is required: the entrypoint renders config.json from those
# variables on every start, so changes in .env apply after `docker compose up -d`
# (which recreates the container).

services:
  quickproxy:
    # dev 分支默认跟进 dev 镜像（-dev 后缀）；main 分支默认是 :latest。
    image: ${IMAGE:-ghcr.io/qingdeng888/aws-quickwork-2api:latest-dev}
    container_name: ${CONTAINER_NAME:-quickproxy}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Host port comes from .env; the container always listens on 8080.
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # config.json and quickwork.db both live here: back up this one directory.
      # The entrypoint fixes its ownership as root on start, then drops to
      # uid 10001 before running the server, so no manual chown is needed.
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    # Leave `user:` unset: the entrypoint needs root for one chown of ./data,
    # then drops to uid 10001 (APP_UID) before starting the server.
    healthcheck:
      # $$ escapes Compose interpolation so the container shell expands ADDR.
      test: ["CMD-SHELL", "port=\"$${ADDR##*:}\"; wget -qO- \"http://127.0.0.1:$${port:-8080}/healthz\" >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
